name: Build and Deploy to Fronthost

on:
  push:
    branches:
      - main
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      env:
        NODE_ENV: production
        VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        VITE_GITHUB_USERNAME: ${{ secrets.VITE_GITHUB_USERNAME }}
        
    - name: Deploy to fronthost repository
      run: |
        # Set up git credentials
        git config --global url."https://${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"
        
        # Clone the target repository
        git clone "https://github.com/pamod-madubashana/pamod-madubashana.github.io.git" deployment
        cd deployment
        
        # Clean the target directory
        rm -rf ./* || true
        
        # Copy built files to deployment directory
        cp -r ../dist/* ./
        
        # Configure git
        # Configure git
        git config --local user.email "pamod.main@gmail.com"
        git config --local user.name "pamod-madubashana"

        # Check if there are changes
        if [[ -n $(git status --porcelain) ]]; then
          echo "Committing changes..."
          git add .
          git commit -m "Deploy build files from $GITHUB_REPOSITORY@$GITHUB_SHA [ci skip]"
          
          # Push to fronthost repository
          git remote set-url origin "https://${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/pamod-madubashana/pamod-madubashana.github.io.git"
          git push
          echo "Changes pushed successfully!"
        else
          echo "No changes to commit"
        fi
      env:
        PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}