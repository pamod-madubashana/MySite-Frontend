name: Build and Deploy to Fronthost

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      env:
        NODE_ENV: production
        VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        VITE_GITHUB_USERNAME: ${{ secrets.VITE_GITHUB_USERNAME }}
        
    - name: Deploy to fronthost repository
      run: |
        # Clone the target repository
        git clone "https://github.com/pamod-madubashana/fronthost.git" deployment
        cd deployment
        
        # Clean the target directory
        rm -rf ./* || true
        
        # Copy built files to deployment directory
        cp -r ../dist/* ./
        
        # Configure git
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Check if there are changes
        if [[ -n $(git status --porcelain) ]]; then
          echo "Committing changes..."
          git add .
          git commit -m "Deploy build files from $GITHUB_REPOSITORY@$GITHUB_SHA [ci skip]"
          
          # Push to fronthost repository
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/pamod-madubashana/fronthost.git"
          echo "Changes pushed successfully!"
        else
          echo "No changes to commit"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}